# XTulator ProGuard Configuration
# Basic configuration for Android 1.6 (API 4) Ant build

# Optimization settings
-optimizationpasses 5
-dontusemixedcaseclassnames
-dontskipnonpubliclibraryclasses
-dontpreverify
-verbose

# Keep attributes needed for reflection/JNI
-keepattributes SourceFile,LineNumberTable,*Annotation*,EnclosingMethod,Signature,InnerClasses

# Keep native method names for JNI
-keepclasseswithmembernames class * {
    native <methods>;
}

# Keep public classes and main activity
-keep public class com.xtulator.android.XTulatorActivity {
    public protected *;
}

# Keep R class and generated resources
-keep class com.xtulator.android.R$* {
    <fields>;
}

# Keep parcelable classes (if any)
-keep class * implements android.os.Parcelable {
    public static final android.os.Parcelable$Creator *;
}

# Keep enum values
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# Suppress warnings for missing classes (common in old API)
-dontwarn android.**
-dontwarn java.nio.**
-dontwarn javax.**

# Optimize for size
-optimizations !code/simplification/arithmetic,!field/*,!class/merging/*

# Output mapping file for debugging
-printmapping out/mapping.txt